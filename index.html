        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select { width: 100%; padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; }
        .result-box { background-color: #eef2f7; padding: 15px; border-radius: 5px; margin-top: 20px; }
        .result-item { margin-bottom: 10px; font-size: 16px; }
        .result-value { font-weight: bold; color: #e74c3c; font-size: 18px; }
    </style>
</head>

    window.onload = function() {
        let c = document.getElementById('currentLv');
        let t = document.getElementById('targetLv');
        for(let i=0; i<=99; i++) {
            c.options.add(new Option('Lv ' + i, i));
            t.options.add(new Option('Lv ' + i, i));
        }
        c.value = 0;
        updateTargetOptions();
        t.value = 1;
        calc();
    };

    // 現在のLvが変わったときに、目標Lvの選択肢を現在のLvより上だけにする
    function onCurrentChange() {
        let cur = parseInt(document.getElementById('currentLv').value);
        let t = document.getElementById('targetLv');
        let oldTarget = parseInt(t.value);

        t.innerHTML = "";
        for(let i = cur + 1; i <= 99; i++) {
            t.options.add(new Option('Lv ' + i, i));
        }

        // もし以前の目標Lvが新基準より小さければ、一番近い上のLvにする
        if(oldTarget <= cur) {
            t.value = cur + 1 <= 99 ? cur + 1 : 99;
        } else {
            t.value = oldTarget;
        }
        calc();
    }

    function updateTargetOptions() {
        let cur = parseInt(document.getElementById('currentLv').value);
        let t = document.getElementById('targetLv');
        t.innerHTML = "";
        for(let i = cur + 1; i <= 99; i++) {
            t.options.add(new Option('Lv ' + i, i));
        }
    }

function calc() {
    let cur = parseInt(document.getElementById('currentLv').value);
    let tar = parseInt(document.getElementById('targetLv').value);

    if (isNaN(tar) || cur >= tar) {
        document.getElementById('nextDia').innerText = "0 ダイヤ";
        document.getElementById('totalDia').innerText = "0 ダイヤ";
        document.getElementById('resCrown').innerText = "0 個";
        return;
    }

    // 現在Lv→目標Lvまでに必要なダイヤ
    let needDia = table[tar].totalDia - table[cur].totalDia;

    // 次のLvまでに必要なダイヤ
    let nextDia = table[cur + 1].totalDia - table[cur].totalDia;

    // 現在Lv→目標Lvまでに必要な王冠
    let crown = table[tar].crown - table[cur].crown;

    document.getElementById('nextDia').innerText = nextDia.toLocaleString() + " ダイヤ";
    document.getElementById('totalDia').innerText = needDia.toLocaleString() + " ダイヤ";
    document.getElementById('resCrown').innerText = crown.toLocaleString() + " 個";
}
